{% extends "base.html" %}
{% block title %}Stats • Vibezzzzz{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold text-vibe-200 mb-6">📊 Bot Statistics</h1>
<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
  <div class="p-6 rounded-xl bg-vibe-800/50 border border-vibe-700">
    <div class="text-vibe-400 text-sm">Servers</div>
    <div class="text-3xl font-bold text-vibe-200">{{ stats.guilds }}</div>
  </div>
  <div class="p-6 rounded-xl bg-vibe-800/50 border border-vibe-700">
    <div class="text-vibe-400 text-sm">Users tracked</div>
    <div class="text-3xl font-bold text-vibe-200">{{ stats.users }}</div>
  </div>
  <div class="p-6 rounded-xl bg-vibe-800/50 border border-vibe-700">
    <div class="text-vibe-400 text-sm">Total vibes</div>
    <div class="text-3xl font-bold text-vibe-200">{{ stats.total_vibes }}</div>
  </div>
</div>
{% endblock %}
