{% extends "base.html" %}
{% block title %}{{ guild.name }} • Vibezzzzz{% endblock %}
{% block content %}
<div class="flex items-center gap-4 mb-8">
  {% if guild.icon %}
    <img src="https://cdn.discordapp.com/icons/{{ guild.id }}/{{ guild.icon }}.png?size=80" class="w-16 h-16 rounded-xl" alt="">
  {% else %}
    <div class="w-16 h-16 rounded-xl bg-vibe-800 flex items-center justify-center text-3xl">🏠</div>
  {% endif %}
  <div>
    <h1 class="text-3xl font-bold text-vibe-200">{{ guild.name }}</h1>
    <p class="text-vibe-400 text-sm">Server ID: {{ guild.id }}</p>
  </div>
</div>
<p>Use Discord commands and dashboard forms to manage this server.</p>
<a href="/servers" class="text-vibe-400">← Back</a>
{% endblock %}
