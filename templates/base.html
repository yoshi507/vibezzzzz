<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Vibezzzzz{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{vibe:{900:'#0f0a1a',800:'#1a1229',700:'#2d1f4e',600:'#4c1d95',500:'#7c3aed',400:'#a78bfa',300:'#c4b5fd',200:'#ddd6fe'}}}}}</script>
</head>
<body class="bg-vibe-900 text-vibe-200 min-h-screen">
  <nav class="border-b border-vibe-700 bg-vibe-800/50 backdrop-blur px-6 py-4 flex items-center justify-between">
    <a href="/" class="text-xl font-bold text-vibe-300">✨ Vibezzzzz</a>
    <div class="flex gap-4 text-sm">
      {% if user %}
        <a href="/servers" class="hover:text-vibe-300">Servers</a>
        <a href="/leaderboard" class="hover:text-vibe-300">Leaderboard</a>
        <a href="/stats" class="hover:text-vibe-300">Stats</a>
        <a href="/admin" class="hover:text-vibe-300">Admin</a>
        <a href="/logout" class="text-vibe-400">Logout</a>
      {% else %}
        <a href="/login" class="bg-vibe-600 hover:bg-vibe-500 px-3 py-1 rounded-lg">Login with Discord</a>
      {% endif %}
    </div>
  </nav>
  <main class="max-w-5xl mx-auto px-4 py-8">{% block content %}{% endblock %}</main>
</body>
</html>
