{% extends "base.html" %}
{% block title %}Leaderboard • Vibezzzzz{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold text-vibe-200 mb-6">🏆 Global Leaderboard</h1>
<div class="bg-vibe-800/50 rounded-xl border border-vibe-700 overflow-hidden">
  <table class="w-full text-left">
    <thead class="bg-vibe-800 text-vibe-400 text-sm">
      <tr><th class="p-3">#</th><th class="p-3">User</th><th class="p-3 text-right">Vibes</th></tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr class="border-t border-vibe-700">
        <td class="p-3">{{ loop.index }}</td>
        <td class="p-3">{{ row.user_id }}</td>
        <td class="p-3 text-right font-mono text-vibe-300">{{ row.balance }}</td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="p-6 text-center text-vibe-400">No data yet</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
